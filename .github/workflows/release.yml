name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version to release, for example 2.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          $version = $version -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' must look like 2.0.1 or 2.0.1-beta.1"
          }
          $tag = "V$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "Tag to create: $tag"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore source/WledSRServer/WledSRServer.csproj

      - name: Publish application
        run: >-
          dotnet publish source/WledSRServer/WledSRServer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "WledSRServer.zip"
          Compress-Archive -Path publish\* -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_ENV

      - name: Create version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if (git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" 2>$null) {
            throw "Tag '$env:RELEASE_TAG' already exists"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG -m "Release $env:RELEASE_TAG"
          git push origin $env:RELEASE_TAG

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WLED SR Audio Server ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.archive }}